name: Geph5 autobuild

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geph5-autobuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      current: ${{ steps.check.outputs.current }}
      client: ${{ steps.check.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=$(bash scripts/autobuild.sh check)
          {
            echo "current=$packages"
            echo "packages=$(jq -c '[.[] | select(.released == false)]' <<< "$packages")"
            echo "client=$(jq -r '.[] | select(.crate == "geph5-client").version' <<< "$packages")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.packages != '[]'
    runs-on: ${{ endsWith(matrix.target, '-windows-msvc') && 'windows-2025' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.packages) }}
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross
      - shell: bash
        env:
          CRATE: ${{ matrix.package.crate }}
          VERSION: ${{ matrix.package.version }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/autobuild.sh build "$CRATE" "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package.crate }}-v${{ matrix.package.version }}-${{ matrix.target }}
          path: dist/${{ matrix.package.crate }}-v${{ matrix.package.version }}/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.package.crate }}-v${{ matrix.package.version }}-*
          path: dist/${{ matrix.package.crate }}-v${{ matrix.package.version }}
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ matrix.package.crate }}
          VERSION: ${{ matrix.package.version }}
        run: bash scripts/autobuild.sh release "$CRATE" "$VERSION"

  images:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.current != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.current) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ matrix.package.crate }}
          VERSION: ${{ matrix.package.version }}
          CLIENT_VERSION: ${{ needs.check.outputs.client }}
        run: bash scripts/image.sh

  openwrt:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.client != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        series: ['24.10.6', '25.12.6']
        arch: [x86_64, aarch64_generic]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64_generic'
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.client }}
          SERIES: ${{ matrix.series }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/openwrt.sh
